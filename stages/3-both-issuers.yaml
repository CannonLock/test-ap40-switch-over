# Stage 3: both exports trust the /ospool/ap40 embedded issuer (first) and the old issuer.
# uw-shared trusts the ap40 issuer too, because after stage 4 the AP mints every token with that iss.
# Stage 4 (the AP switches its iss) needs no Origin change.
Logging:
  Origin:
    Scitokens: trace
Server:
  Hostname: ap40.uw.osg-htc.org
  ExternalWebUrl: https://ap40.uw.osg-htc.org:8444
  WebPort: 8444
  IssuerUrl: https://osg-htc.org/ospool
Federation:
  DiscoveryUrl: https://osg-htc.org
Origin:
  StorageType: posix
  EnableIssuer: true
  IssuerMode: embedded
  Exports:
    - FederationPrefix: /ospool/ap40/
      StoragePrefix: /storage/ap40/
      Capabilities: ["DirectReads", "Writes", "Reads", "Listings"]
      IssuerJwks: /etc/pelican/ap40-issuer.jwks
      IssuerUrls:
        - https://ap40.uw.osg-htc.org:8444/api/v1.0/issuer/ns/ospool/ap40     # added, first
        - https://osg-htc.org/ospool
    - FederationPrefix: /ospool/uw-shared/projects/
      StoragePrefix: /storage/uw-shared/projects/
      Capabilities: ["DirectReads", "Writes", "Reads", "Listings"]
      IssuerUrls:
        - https://ap40.uw.osg-htc.org:8444/api/v1.0/issuer/ns/ospool/ap40     # added, first
        - https://osg-htc.org/ospool
